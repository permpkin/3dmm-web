# Cloudflare deploy config — static assets only, built by `npm run build` into dist/.
# No worker script (no `main`); `assets` alone hosts the site on the Workers
# platform (which Cloudflare Pages now deploys through). TOML, not .jsonc —
# build images on wrangler <3.91 don't read the JSON formats.
name = "3dmm-web"
compatibility_date = "2025-10-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
